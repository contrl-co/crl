# Reproducible-release configuration for crlc.
#
# Determinism requirements: pinned toolchain via go.mod,
# CGO disabled, -trimpath, stripped symbols, and mod_timestamp pinned
# to the commit — the same tag must build byte-identical binaries
# anywhere.
version: 2

project_name: crlc

builds:
  - id: crlc
    main: ./cmd/crlc
    binary: crlc
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: crlc
    formats: [tar.gz]
    name_template: "crlc_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: cyclonedx
    artifacts: archive
    documents:
      - "${artifact}.cdx.json"
    cmd: syft
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

signs:
  # Keyless cosign: no long-lived release key exists. The
  # signing identity is this repository's CI OIDC identity; consumers
  # verify with --certificate-identity-regexp (see docs/install.md).
  - id: checksums
    cmd: cosign
    artifacts: checksum
    output: true
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - --yes
      - "${artifact}"

release:
  github:
    owner: contrl-co
    name: crl
  draft: false
  prerelease: auto
  mode: keep-existing
  replace_existing_artifacts: false
  extra_files:
    - glob: editors/vscode/crl-language-support-*.vsix

brews:
  - name: crlc
    ids: [crlc]
    description: "CRL (CONTRL Rule Language) toolchain: lint, compile, fmt, eval, graph"
    homepage: https://github.com/contrl-co/crl
    license: AGPL-3.0-only
    directory: Formula
    skip_upload: false
    repository:
      owner: contrl-co
      name: homebrew-tap
      # The protected tap rejects direct release pushes. Generate one branch
      # per version and open a reviewable PR against main instead.
      branch: "release/crlc-{{ .Version }}"
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: contrl-co
          name: homebrew-tap
          branch: main
    test: |
      assert_match "editions: v1", shell_output("#{bin}/crlc version")
