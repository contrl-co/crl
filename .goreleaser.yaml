# Reproducible-release configuration for crlc.
#
# Determinism requirements: pinned toolchain via go.mod,
# CGO disabled, -trimpath, stripped symbols, and mod_timestamp pinned
# to the commit — the same tag must build byte-identical binaries
# anywhere.
version: 2

project_name: crlc

builds:
  - id: crlc
    main: ./cmd/crlc
    binary: crlc
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: crlc
    formats: [tar.gz]
    name_template: "crlc_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: cyclonedx
    artifacts: archive
    documents:
      - "${artifact}.cdx.json"
    cmd: syft
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

signs:
  # Keyless cosign: no long-lived release key exists. The
  # signing identity is this repository's CI OIDC identity; consumers
  # verify with --certificate-identity-regexp (see docs/install.md).
  - id: checksums
    cmd: cosign
    artifacts: checksum
    output: true
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - --yes
      - "${artifact}"

release:
  gitlab:
    owner: contrl-group
    name: crl
  draft: false
  mode: replace

brews:
  - name: crlc
    ids: [crlc]
    description: "CRL (CONTRL Rule Language) toolchain: lint, compile, fmt, eval, graph"
    homepage: https://gitlab.com/contrl-group/crl
    license: Apache-2.0
    directory: Formula
    # Flip to false once the tap repository exists.
    skip_upload: true
    repository:
      owner: contrl-group
      name: homebrew-crl
    test: |
      assert_match "editions: v1", shell_output("#{bin}/crlc version")
