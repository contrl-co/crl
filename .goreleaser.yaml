# Reproducible-release configuration for crlc.
#
# Determinism requirements: pinned toolchain via go.mod,
# CGO disabled, -trimpath, stripped symbols, and mod_timestamp pinned
# to the commit — the same tag must build byte-identical binaries
# anywhere.
version: 2

project_name: crlc

# The release job authenticates with CI_JOB_TOKEN (GITLAB_TOKEN in
# .gitlab-ci.yml). GoReleaser must be told the token is a job token, or
# it calls PAT-only project endpoints a job token cannot use and the
# publish step 404s. This switches it to CI_API_V4_URL/CI_PROJECT_ID and
# the JOB-TOKEN header for the package-registry upload.
gitlab_urls:
  use_job_token: true

builds:
  - id: crlc
    main: ./cmd/crlc
    binary: crlc
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: crlc
    formats: [tar.gz]
    name_template: "crlc_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: cyclonedx
    artifacts: archive
    documents:
      - "${artifact}.cdx.json"
    cmd: syft
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

signs:
  # Keyless cosign: no long-lived release key exists. The
  # signing identity is this repository's CI OIDC identity; consumers
  # verify with --certificate-identity-regexp (see docs/install.md).
  - id: checksums
    cmd: cosign
    artifacts: checksum
    output: true
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - --yes
      - "${artifact}"

release:
  gitlab:
    owner: contrl-group
    name: crl
  draft: false
  mode: replace

brews:
  - name: crlc
    ids: [crlc]
    description: "CRL (CONTRL Rule Language) toolchain: lint, compile, fmt, eval, graph"
    homepage: https://gitlab.com/contrl-group/crl
    license: Apache-2.0
    directory: Formula
    skip_upload: false
    repository:
      owner: contrl-group
      name: homebrew-tap
      # The tap's default branch is main; without this, goreleaser
      # commits the formula to the crl project's default branch name
      # (develop), which does not exist on the tap, and the push 400s.
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    test: |
      assert_match "editions: v1", shell_output("#{bin}/crlc version")
