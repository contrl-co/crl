name: ci

on:
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
  push:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22.21.1"
  GOFLAGS: -mod=readonly

jobs:
  regression-gates:
    name: Review regression gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Require disclosure for hash drift
        run: sh scripts/ci/check-hash-disclosure.sh "$(git rev-parse HEAD^1)"
      - name: Require new tests to pin their change
        run: sh scripts/ci/check-new-tests-pin.sh "$(git rev-parse HEAD^1)"

  go:
    name: Go / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-14
          - name: windows-amd64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            echo "::error::Go files need formatting."
            exit 1
          fi
      - name: Vet
        if: runner.os == 'Linux'
        run: go vet ./...
      - name: Lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
      - name: Race test
        if: runner.os == 'Linux'
        run: go test ./... -race -count=1
      - name: Cross-platform test
        if: runner.os != 'Linux'
        run: go test ./... -count=1
      - name: Pin canonical hashes on every platform
        run: go test . -run "TestExamplesMatchGoldenHashes|TestExamplesCanonicalRoundTrip" -count=1
      - name: Vulnerability reachability
        if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  golden-arm64:
    name: Golden hashes / linux-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test . -run "TestExamplesMatchGoldenHashes|TestExamplesCanonicalRoundTrip" -count=1

  docs-and-examples:
    name: Documentation and examples
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Compile every documented CRL block
        run: go test . -run TestDocsCRLBlocks -count=1 -v
      - name: Lint examples
        run: go run ./cmd/crlc lint examples/
      - name: Evaluate the authorized example
        run: >-
          go run ./cmd/crlc eval
          -facts examples/facts/permit_quorum_2of3.authorized.json
          -at 2026-06-02T00:00:00Z
          -require-authorized
          examples/permit_quorum_2of3.crl

  install-script:
    name: Installer trust and recovery paths
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exercise fail-closed installer paths
        run: sh scripts/ci/test-install-script.sh

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check extension assets
        run: npm run check
      - name: Package extension
        run: npm run package -- --out crl-language-support.vsix
      - name: Audit extension dependencies
        run: npm audit --audit-level=high
      - name: Upload extension package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crl-language-support
          path: editors/vscode/crl-language-support.vsix
          if-no-files-found: error
          retention-days: 7

  snapshot-build:
    name: Reproducible snapshot build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build release matrix without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.6.1
          args: build --snapshot --clean
      - name: Upload snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crlc-snapshot
          path: dist/
          if-no-files-found: error
          retention-days: 7

  trivy:
    name: Trivy scan
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan filesystem
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/work"
          --workdir /work
          aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
          fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 .

  grype:
    name: Grype scan
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan filesystem
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/work"
          anchore/grype:v0.116.1@sha256:1e71065c0a4cff3e6bd3b8add525ffac4343eb4971694eb90a31cf6d4d3e85db
          dir:/work --fail-on high --quiet

  gate:
    name: ci / gate
    if: always()
    needs:
      - regression-gates
      - go
      - golden-arm64
      - docs-and-examples
      - install-script
      - vscode-extension
      - snapshot-build
      - trivy
      - grype
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REGRESSION: ${{ needs.regression-gates.result }}
          GO: ${{ needs.go.result }}
          GOLDEN_ARM64: ${{ needs.golden-arm64.result }}
          DOCS: ${{ needs.docs-and-examples.result }}
          INSTALL_SCRIPT: ${{ needs.install-script.result }}
          VSCODE: ${{ needs.vscode-extension.result }}
          SNAPSHOT: ${{ needs.snapshot-build.result }}
          TRIVY: ${{ needs.trivy.result }}
          GRYPE: ${{ needs.grype.result }}
        shell: bash
        run: |
          set -euo pipefail

          require_result() {
            job="$1"
            actual="$2"
            expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$job: expected $expected, got $actual."
              return 1
            fi
          }

          require_result go "$GO" success
          require_result golden-arm64 "$GOLDEN_ARM64" success
          require_result docs-and-examples "$DOCS" success
          require_result install-script "$INSTALL_SCRIPT" success
          require_result vscode-extension "$VSCODE" success
          require_result snapshot-build "$SNAPSHOT" success

          if [ "$EVENT_NAME" = pull_request ]; then
            require_result regression-gates "$REGRESSION" success
          else
            require_result regression-gates "$REGRESSION" skipped
          fi

          if [ "$EVENT_NAME" = push ]; then
            require_result trivy "$TRIVY" skipped
            require_result grype "$GRYPE" skipped
          else
            require_result trivy "$TRIVY" success
            require_result grype "$GRYPE" success
          fi
