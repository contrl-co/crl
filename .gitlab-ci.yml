# CI for the CRL toolchain: lint -> test -> build -> package -> release.
#
# Tool versions are pinned; bumping one is a reviewed change. Release
# jobs run only on semver tags (vX.Y.Z) and sign artifacts with keyless
# cosign via GitLab OIDC — no long-lived signing key exists anywhere in
# this pipeline.

stages:
  - lint
  - test
  - build
  - package
  - release

variables:
  GO_IMAGE: golang:1.25.4
  NODE_IMAGE: node:22.12.0
  GORELEASER_IMAGE: goreleaser/goreleaser:v2.6.1
  TRIVY_IMAGE: aquasec/trivy:0.58.1
  GRYPE_IMAGE: anchore/grype:v0.86.1
  GOFLAGS: -mod=readonly
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build

.go-cache: &go-cache
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/go-mod
      - .cache/go-build

gofmt-vet:
  stage: lint
  image: $GO_IMAGE
  <<: *go-cache
  script:
    - test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: files need formatting"; exit 1; }
    - go vet ./...

test:
  stage: test
  image: $GO_IMAGE
  <<: *go-cache
  script:
    # Includes the golden-corpus determinism gate, the canonical
    # round-trip test, and docs-lint (every fenced crl block in every
    # markdown file compiles — or provably fails, for counterexamples).
    - go test ./... -count=1

# Every fenced ```crl block in every markdown file must compile (or
# provably fail, for expect-error counterexamples). A non-compiling
# documentation example can never ship.
docs-lint:
  stage: test
  image: $GO_IMAGE
  <<: *go-cache
  script:
    - go test . -run TestDocsCRLBlocks -count=1 -v

examples-lint:
  stage: test
  image: $GO_IMAGE
  <<: *go-cache
  script:
    - go run ./cmd/crlc lint examples/
    - go run ./cmd/crlc eval -facts examples/facts/permit_quorum_2of3.authorized.json -at 2026-06-02T00:00:00Z -require-authorized examples/permit_quorum_2of3.crl

# Cross-platform determinism: the golden test must produce
# identical hashes on every OS/arch. Shared gitlab.com runners are
# linux/amd64; enable the tagged jobs below when macOS/Windows runners
# are attached to the project.
golden-linux-arm64:
  stage: test
  image: $GO_IMAGE
  <<: *go-cache
  tags: [saas-linux-small-arm64]
  script:
    - go test . -run 'TestExamplesMatchGoldenHashes|TestExamplesCanonicalRoundTrip' -count=1
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG
      allow_failure: true # flip to hard-fail once arm64 runner quota is confirmed

# golden-macos:
#   stage: test
#   tags: [saas-macos-medium-m1]
#   script: [ "go test . -run TestExamplesMatchGoldenHashes -count=1" ]
# golden-windows:
#   stage: test
#   tags: [saas-windows-medium-amd64]
#   script: [ "go test . -run TestExamplesMatchGoldenHashes -count=1" ]

snapshot-build:
  stage: build
  image:
    name: $GORELEASER_IMAGE
    entrypoint: [""]
  script:
    - goreleaser build --snapshot --clean
  artifacts:
    paths: [dist/]
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH

vscode-extension:
  stage: package
  image: $NODE_IMAGE
  script:
    - cd editors/vscode
    - npm run check
    - npx --yes @vscode/vsce@3.2.1 package --out crl-language-support.vsix
  artifacts:
    paths: [editors/vscode/crl-language-support.vsix]
    expire_in: 1 week

trivy-scan:
  stage: test
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln,secret --exit-code 1 --severity CRITICAL,HIGH .
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

grype-scan:
  stage: test
  image:
    name: $GRYPE_IMAGE
    entrypoint: [""]
  script:
    - grype dir:. --fail-on high
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

release:
  stage: release
  image:
    name: $GORELEASER_IMAGE
    entrypoint: [""]
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
  before_script:
    # goreleaser image ships syft; cosign is installed pinned.
    - apk add --no-cache cosign=~2
  script:
    - go test ./... -count=1 # nothing releases around a red gate
    - goreleaser release --clean
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

release-vsix:
  stage: release
  image: $NODE_IMAGE
  script:
    - cd editors/vscode
    - npm run check
    - npx --yes @vscode/vsce@3.2.1 package --out crl-language-support-$CI_COMMIT_TAG.vsix
    # Marketplace publication requires VSCE_PAT (a marketplace token);
    # the job packages unconditionally and publishes when the token is
    # configured, so releases do not silently depend on a secret.
    - if [ -n "$VSCE_PAT" ]; then npx --yes @vscode/vsce@3.2.1 publish --packagePath crl-language-support-$CI_COMMIT_TAG.vsix; else echo "VSCE_PAT not set; skipping marketplace publish"; fi
  artifacts:
    paths: [editors/vscode/crl-language-support-*.vsix]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
